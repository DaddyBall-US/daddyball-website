<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DaddyBall | Coming Soon to Roseville, California</title>
<meta name="description" content="DaddyBall batting cages and baseball simulator entertainment. Coming soon to Roseville, California.">
<style>
:root{--red:#f01822;--black:#050505;--white:#fff;--muted:#d5d5d5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;background:radial-gradient(circle at 50% 8%,#2b0a0a 0%,#150707 34%,#070707 70%,#030303 100%);color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
.hero{width:min(1100px,calc(100% - 32px));padding:44px 0 36px}
.logo{width:min(850px,92vw);height:auto;display:block;margin:0 auto 18px;filter:drop-shadow(0 20px 38px rgba(0,0,0,.5))}
.eyebrow{display:inline-block;border:1px solid #555;border-radius:999px;padding:9px 16px;margin:0 0 24px;font-size:.78rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.03)}
h1{font-size:clamp(3rem,8vw,6.4rem);line-height:.92;letter-spacing:-.055em;margin:0;font-weight:950}
h1 span{color:var(--red)}
.sub{font-size:clamp(1rem,2.1vw,1.28rem);line-height:1.55;color:#eee;margin:24px auto 0;max-width:780px}
.punch{margin-top:16px;font-weight:850;color:#fff}
.coming{margin:42px auto 0;padding-top:30px;border-top:1px solid #2c2c2c;max-width:720px;text-transform:uppercase;font-weight:950;letter-spacing:.08em;font-size:clamp(1.45rem,3vw,2.2rem);line-height:1.25}
.coming span{display:block;color:var(--red);font-size:1.12em;margin-top:6px}
footer{margin-top:38px;color:#999;font-size:.82rem}
@media(max-width:600px){.hero{padding-top:28px}.logo{margin-bottom:12px}.sub{max-width:92%}.coming{margin-top:32px;padding-top:24px}}
</style>
</head>
<body>
<main class="hero">
  <img class="logo" src="barsign.png" alt="DaddyBall">
  <div class="eyebrow">Batting Cages + Baseball Simulator</div>
  <h1>Get treated like<br><span>the coach's kid.</span></h1>
  <p class="sub">More reps. Better swings. DaddyBall is built for players who want serious work—and baseball fans who want to compete, hang out and play.</p>
  <div class="punch">Everybody gets treated like the favorite.</div>
  <div class="coming">Coming Soon to<span>Roseville, California</span></div>
  <footer>DaddyBall™</footer>
</main>
</body>
</html>
