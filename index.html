<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DaddyBall | Coming Soon to Roseville, CA</title>

  <meta name="description"
        content="DaddyBall batting cages and baseball simulator entertainment. Coming soon to Roseville, California.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at center top, #381010 0%, #160707 45%, #070707 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero {
      width: 100%;
      max-width: 1100px;
      padding: 60px 24px;
    }

    .brand {
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 900;
      font-style: italic;
      line-height: .9;
      letter-spacing: -6px;
      margin-bottom: 35px;
    }

    .brand .daddy {
      color: #f5f5f5;
    }

    .brand .ball {
      color: #ef1724;
    }

    .tag {
      display: inline-block;
      padding: 10px 18px;
      margin-bottom: 30px;
      border: 1px solid #666;
      border-radius: 30px;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -3px;
    }

    h1 span {
      color: #ff1724;
    }

    .slogan {
      margin: 25px auto 0;
      font-size: clamp(1rem, 2vw, 1.3rem);
      line-height: 1.5;
      color: #eee;
    }

    .coming-soon {
      margin-top: 45px;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      line-height: 1.2;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .coming-soon span {
      color: #ff1724;
    }

    footer {
      margin-top: 60px;
      color: #999;
      font-size: .85rem;
    }
  </style>
</head>

<body>

  <main class="hero">

    <div class="brand">
      <span class="daddy">Daddy</span><span class="ball">Ball</span>
    </div>

    <div class="tag">
      BATTING CAGES + BASEBALL SIMULATOR
    </div>

    <h1>
      Get treated like<br>
      <span>the coach's kid.</span>
    </h1>

    <div class="slogan">
      More reps. Better swings. No politics.
    </div>

    <div class="coming-soon">
      Coming Soon to<br>
      <span>Roseville, California</span>
    </div>

    <footer>
      DaddyBall™
    </footer>

  </main>

</body>
</html>
